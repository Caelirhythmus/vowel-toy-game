<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元音演变实验室 · Vowel Change Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-row">
                <div class="header-text">
                    <h1 data-i18n="app.title">元音演变实验室</h1>
                    <p class="subtitle" data-i18n="app.subtitle"></p>
                </div>
                <button id="lang-btn" class="lang-btn" aria-label="Switch language">EN</button>
            </div>
        </header>

        <section class="game-area">
            <div class="settings">
                <div class="setting">
                    <label for="mode-select" data-i18n="set.mode"></label>
                    <select id="mode-select">
                        <option value="mixed" data-i18n="mode.mixed"></option>
                        <option value="type" data-i18n="mode.type"></option>
                        <option value="freq" data-i18n="mode.freq"></option>
                        <option value="system" data-i18n="mode.system"></option>
                    </select>
                </div>
                <div class="setting">
                    <label for="difficulty-select" data-i18n="set.difficulty"></label>
                    <select id="difficulty-select">
                        <option value="easy" data-i18n="diff.easy"></option>
                        <option value="hard" data-i18n="diff.hard"></option>
                    </select>
                </div>
                <div class="setting">
                    <label for="time-select" data-i18n="set.time"></label>
                    <select id="time-select">
                        <option value="0" data-i18n="time.unlimited"></option>
                        <option value="30" data-i18n="time.30"></option>
                        <option value="60" data-i18n="time.60"></option>
                        <option value="90" data-i18n="time.90"></option>
                        <option value="120" data-i18n="time.120"></option>
                    </select>
                </div>
                <div class="btn-row">
                    <button id="start-btn" class="btn start" data-i18n="btn.start"></button>
                    <button id="reset-btn" class="btn reset" data-i18n="btn.reset"></button>
                </div>
            </div>

            <div class="timer" id="timer-box" hidden>
                <span data-i18n="timer.left"></span>：
                <span id="timer-display" class="timer-value">--</span>
            </div>

            <div id="question-area" class="question-area">
                <p class="prompt" id="prompt"></p>
                <div class="words" id="words" aria-label="change pair"></div>
                <div class="chart-wrap">
                    <h3 class="chart-title" data-i18n="chart.title"></h3>
                    <div id="chart"></div>
                    <div class="chart-legend">
                        <span class="dot dot-a"></span><span data-i18n="chart.a"></span>
                        <span class="dot dot-b"></span><span data-i18n="chart.b"></span>
                    </div>
                </div>
                <div id="options" class="options" role="group"></div>
                <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
            </div>

            <div class="stats" id="stats"></div>
        </section>

        <section class="info">
            <details open>
                <summary data-i18n="info.model"></summary>
                <ul>
                    <li data-i18n="info.model.l1"></li>
                    <li data-i18n="info.model.l2"></li>
                    <li data-i18n="info.model.l3"></li>
                    <li data-i18n="info.model.l4"></li>
                </ul>
            </details>
            <details open>
                <summary data-i18n="info.types"></summary>
                <div id="cheatsheet"></div>
            </details>
            <details>
                <summary>参考资料 · References</summary>
                <ul class="refs">
                    <li>王力《汉语史稿》《汉语语音史》（元音高化倾向）</li>
                    <li>Wikipedia: <a href="https://en.wikipedia.org/wiki/Great_Vowel_Shift" rel="noopener">Great Vowel Shift</a>,
                        <a href="https://en.m.wikipedia.org/wiki/I-umlaut" rel="noopener">Germanic i-umlaut</a>,
                        <a href="https://en.wikipedia.org/wiki/Vowel_reduction" rel="noopener">Vowel reduction</a>,
                        <a href="https://en.wikipedia.org/wiki/Germanic_language_group" rel="noopener">Germanic languages (a-mutation)</a></li>
                    <li>Oxford Phonetics: <a href="https://www.phon.ox.ac.uk/jcoleman/CardinalVowels.htm" rel="noopener">Cardinal Vowels</a></li>
                    <li>本项目语音学误区研究文档：<code>docs/phonetics-misconceptions-and-refactor.md</code></li>
                </ul>
            </details>
        </section>
    </div>

    <!-- 结算弹窗 -->
    <div id="game-over-modal" class="modal" hidden>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="end-title">
            <h2 id="end-title" data-i18n="end.title"></h2>
            <div class="final-stats" id="final-stats"></div>
            <h3 class="mistakes-heading" data-i18n="end.mistakes"></h3>
            <div id="mistake-list"></div>
            <button id="close-modal" class="btn close" data-i18n="btn.close"></button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
