name: Build, test & deploy static site to Pages

on:
  # 在推送到main分支时触发工作流
  push:
    branches: [ "main" ]
  # 允许您从Actions选项卡手动运行此工作流
  workflow_dispatch:

# 设置GITHUB_TOKEN的权限，以允许部署到GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一次部署运行，如果正在运行，则排队
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建、测试并部署
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Vite 构建产物
          path: dist
          # v4 起隐藏文件默认不再打包；保留 .nojekyll 等点文件
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
